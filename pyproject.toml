[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legaledge-kb"
version = "0.1.0"
description = "LegalEdge Phase 1.1 — Indian statute knowledge base with grounded RAG question answering"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
authors = [{ name = "Recklabs AI" }]

# ---------------------------------------------------------------------------
# Runtime dependencies of the API *and* the CLI (both share services/).
# Every version is an exact pin. See docs/BUILD-LOG.md for the resolution run.
# ---------------------------------------------------------------------------
dependencies = [
  # Core API
  "fastapi==0.115.14",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "sse-starlette==2.1.3",
  "python-multipart==0.0.32",
  # Database
  "sqlalchemy[asyncio]==2.0.36",
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.13",
  "pgvector==0.3.6",
  # Models and inference (CPU only — see docs/adr/0001)
  "sentence-transformers==3.3.1",
  "transformers==4.46.3",
  "torch==2.5.1",
  "litellm==1.59.12",
  "instructor==1.6.4",
  "tiktoken==0.8.0",
  # HTTP + CLI shared by API and pipeline
  "httpx==0.27.2",
  "tenacity==9.0.0",
  "typer==0.13.1",
  "rich==13.9.4",
  # Security
  "argon2-cffi==23.1.0",
  "pyjwt==2.9.0",
  "cryptography==43.0.3",
  # Ops
  "redis==5.2.1",
  "langfuse==2.59.7",
  "sentry-sdk==2.69.1",
  "prometheus-fastapi-instrumentator==7.1.0",
  "structlog==24.4.0",
]

[project.optional-dependencies]
# Corpus pipeline only. Deliberately NOT installed into the API image:
# docling + ocrmypdf + datasets add ~1.5 GB that the request path never touches.
corpus = [
  "lxml==5.3.2",
  "selectolax==0.3.34",
  "docling==2.126.0",
  "pymupdf==1.24.14",
  "ocrmypdf==16.13.0",
  "datasets==3.6.0",
]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.3.0",
  "ruff==0.7.4",
  "mypy==1.13.0",
  "types-pyyaml==6.0.12.20260906",
]
# eval only — ragas must never be imported from app code.
eval = [
  "ragas==0.2.15",
]

[project.scripts]
legaledge-kb = "legaledge_kb.main:main"

[tool.setuptools.packages.find]
where = ["apps/api", "cli"]
include = ["app*", "legaledge_kb*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "cli", "tests"]
exclude = ["apps/api/alembic/versions", ".venv", "var"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                 # isort
  "UP",                # pyupgrade
  "B",                 # bugbear
  "C4",                # comprehensions
  "SIM",               # simplify
  "ANN",               # type annotations on public functions
  "ASYNC",             # async pitfalls
  "S",                 # bandit
  "T20",               # no print() in app code
  "RET", "ARG", "PTH",
]
ignore = [
  "ANN101",  # self needs no annotation
  "ANN102",  # cls needs no annotation
  "ANN401",  # allow typing.Any where it is genuinely open
  "B008",    # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S105", "S106", "ARG001", "ARG002"]
"cli/**" = ["T20"]          # the CLI is a terminal program; rich/print is its output
"scripts/**" = ["T20", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app", "legaledge_kb"]

# Advisory, not a gate (scope decision 2026-09-11): run `mypy` when touching
# typed plumbing, but a failure does not block a stage. ruff remains a gate.
[tool.mypy]
python_version = "3.12"
files = ["apps/api/app", "cli/legaledge_kb", "tests"]
mypy_path = "apps/api:cli"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["apps/api/alembic/versions/.*"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
  "structlog.*", "sse_starlette.*", "pgvector.*", "litellm.*", "asyncpg.*",
  "sentence_transformers.*", "docling.*", "selectolax.*", "ocrmypdf.*",
  "langfuse.*", "prometheus_fastapi_instrumentator.*", "ragas.*", "datasets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["apps/api", "cli"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "requires_db: needs a reachable PostgreSQL from DATABASE_URL",
  "requires_models: downloads or loads HuggingFace weights",
]

[tool.coverage.run]
source = ["apps/api/app", "cli/legaledge_kb"]
branch = true
