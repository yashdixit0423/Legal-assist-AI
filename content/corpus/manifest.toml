# The Acts to ingest. Data file, not code: adding the seventh Act is an edit
# here plus one CLI command.
#
# act_id is India Code's stable identifier and links the Act item to its
# section items. The AC_CEN_ prefix matters: searching by title alone returns
# state re-publications of these central Acts (Chhattisgarh, UP, Rajasthan all
# host their own copies), and ingesting one of those would put a state's text
# under a central citation.
#
# expected_sections, where present, is an independent count from
# NyayaLabs98/nyaya-statute-db. It is an oracle for the continuity check, not a
# source of text — see docs/BUILD-LOG.md, 2026-09-11.

