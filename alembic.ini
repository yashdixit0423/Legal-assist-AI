# Alembic configuration.
#
# sqlalchemy.url is deliberately empty: the URL comes from Settings
# (app/core/config.py), which is the only module allowed to read the
# environment. See apps/api/alembic/env.py.

[alembic]
script_location = apps/api/alembic
prepend_sys_path = apps/api
path_separator = os
sqlalchemy.url =

# Keep migration filenames sortable and readable.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
